name: 'Required Spec Validations'
on:
  workflow_call:
    inputs:
      env:
        description: 'Environment to generate the OpenAPI Spec for.'
        required: true
        type: string
    secrets: # all secrets are passed explicitly in this workflow
      api_bot_pat:
        required: true
      slack_bearer_token:
        required: true
permissions:
  contents: write

jobs:  
  required-validations:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        - name: Setup Node
          uses: actions/setup-node@v7
          with:
            node-version: '24.x'
            cache: 'npm'
        - name: Install npm dependencies
          run: npm ci
        - name: Download openapi-foas
          uses: actions/download-artifact@v8
          with:
            name: openapi-foas-${{ inputs.env }}
            github-token: ${{ secrets.api_bot_pat }}
            run-id: ${{ github.run_id }}
        - name: Run IPA validation
          id: ipa-spectral-validation
          run: npm run spectral-lint -- openapi-foas.json --ruleset=./tools/spectral/ipa/ipa-spectral.yaml
        - name: Run Spectral validation
          id: spectral-validation
          run: npm run spectral-lint -- openapi-foas.yaml --ruleset=tools/spectral/.spectral.yaml
        - name: Install Go
          uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
          with:
            go-version-file: 'tools/cli/go.mod'
            cache-dependency-path: "tools/cli/go.sum"
        - name: Checkout GO SDK repository
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            repository: 'mongodb/atlas-sdk-go'
            token: ${{ secrets.api_bot_pat }}
            path: 'atlas-sdk-go'
        - name: Download openapi-foas
          uses: actions/download-artifact@v8
          with:
            name: openapi-foas-${{ inputs.env }}
            github-token: ${{ secrets.api_bot_pat }}
            run-id: ${{ github.run_id }}
        - name: Validate the FOAS can be used with the Go SDK
          id: go-sdk-validation
          run: |
            cp -rf "openapi-foas.yaml" "atlas-sdk-go/openapi/atlas-sdk.yaml"
            # Point the SDK generation pipeline at the freshly built FOAS.
            # Without this, generate.sh falls back to its default and
            # validates the stale atlas-api.yaml committed in the SDK repo.
            export OPENAPI_FILE_NAME="atlas-sdk.yaml"
            pushd atlas-sdk-go
            make -e openapi-pipeline
            popd
        # Notify the APIx DevOps Integrations on-call so an SDK validation
        # failure is routed quickly. Keyed to the go-sdk-validation step
        # outcome: an earlier setup failure (Node, npm, artifact download,
        # Spectral, Go, SDK checkout) leaves this step without a failure
        # outcome, so it does not notify.
        - name: Notify the Go SDK validation failure
          # Notify once per incident. The release retry handler requests a
          # rerun of failed jobs while github.run_attempt < 3, so attempt 3 is
          # the first attempt after the automatic retries are exhausted.
          # Attempts beyond 3 come from reruns the handler already queued and
          # would duplicate the alert.
          if: ${{ failure() && steps.go-sdk-validation.outcome == 'failure' && fromJSON(github.run_attempt) == 3 }}
          env:
            SLACK_BEARER_TOKEN: ${{ secrets.slack_bearer_token }}
            # #cloud-apix-devops-integrations-notifications and
            # @apix-devops-integrations-help (S0C2KP6E273). These are
            # non-sensitive IDs, kept inline because only the repo owner can
            # manage repository secrets.
            SLACK_CHANNEL_ID: C06Q7QF1ZST
            SLACK_HELP_GROUP: '<!subteam^S0C2KP6E273>'
            TARGET_ENV: ${{ inputs.env }}
            RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          run: .github/scripts/notify_sdk_validation_failure.sh
