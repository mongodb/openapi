name: 'Required Spec Validations'
on:
  workflow_call:
    inputs:
      env:
        description: 'Environment to generate the OpenAPI Spec for.'
        required: true
        type: string
    secrets: # all secrets are passed explicitly in this workflow
      api_bot_pat:
        required: true
permissions:
  contents: write

jobs:  
  required-validations:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        - name: Setup Node
          uses: actions/setup-node@v7
          with:
            node-version: '22.x'
            cache: 'npm'
        - name: Install npm dependencies
          run: npm ci
        - name: Download openapi-foas
          uses: actions/download-artifact@v8
          with:
            name: openapi-foas-${{ inputs.env }}
            github-token: ${{ secrets.api_bot_pat }}
            run-id: ${{ github.run_id }}
        - name: Run IPA validation
          id: ipa-spectral-validation
          run: npm run spectral-lint -- openapi-foas.json --ruleset=./tools/spectral/ipa/ipa-spectral.yaml
        - name: Run Spectral validation
          id: spectral-validation
          run: npm run spectral-lint -- openapi-foas.yaml --ruleset=tools/spectral/.spectral.yaml
        - name: Install Go
          uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
          with:
            go-version-file: 'tools/cli/go.mod'
            cache-dependency-path: "tools/cli/go.sum"
        - name: Checkout GO SDK repository
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            repository: 'mongodb/atlas-sdk-go'
            token: ${{ secrets.api_bot_pat }}
            path: 'atlas-sdk-go'
        - name: Download openapi-foas
          uses: actions/download-artifact@v8
          with:
            name: openapi-foas-${{ inputs.env }}
            github-token: ${{ secrets.api_bot_pat }}
            run-id: ${{ github.run_id }}
        - name: Validate the FOAS can be used with the Go SDK
          id: go-sdk-validation
          run: |
            cp -rf "openapi-foas.yaml" "atlas-sdk-go/openapi/atlas-sdk.yaml"
            pushd atlas-sdk-go
            make -e openapi-pipeline
            popd
