---
name: shellcheck
on:
  pull_request:
    paths:
      - "**/**.sh"

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Run ShellCheck
        uses: bewuethr/shellcheck-action@5f25a17fbd899b24f4b35e9fd978831f6fe9917e
