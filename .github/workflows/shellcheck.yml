---
name: shellcheck
on:
  pull_request:
    paths:
      - "**/**.sh"

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run ShellCheck
        uses: bewuethr/shellcheck-action@5f25a17fbd899b24f4b35e9fd978831f6fe9917e
