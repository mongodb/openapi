name: 'Code Health CLI'
# Triggered by changes to either `tools/cli/**` or `tools/foas/**`, because the
# binary depends on the library via a local `replace ../foas` directive — library
# changes can break the binary, so we re-test the binary whenever foas changes.
on:
  push:
    branches:
      - main
    paths:
      - 'tools/cli/**'
      - 'tools/foas/**'
      - '.github/workflows/code-health-cli.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/cli/**'
      - 'tools/foas/**'
      - '.github/workflows/code-health-cli.yml'
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'tools/cli/go.mod'
      - name: Build
        working-directory: tools/cli
        run: make build
  unit-tests:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'tools/cli/go.mod'
      - name: Run unit tests
        working-directory: tools/cli
        run: make unit-test
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: |
            .github
            tools
      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'tools/cli/go.mod'
          cache: false # see https://github.com/golangci/golangci-lint-action/issues/807
      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee
        with:
          version: v2.10.1
          working-directory: tools/cli
  e2e-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'tools/cli/go.mod'
      - name: Run e2e tests
        working-directory: tools/cli
        run: make devtools e2e-test
