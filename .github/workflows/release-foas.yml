name: 'FOAS Library New Release'
run-name: 'Release tools/foas/${{ inputs.version_number }} (skip tests: ${{ inputs.skip_tests }}, use existing tag: ${{ inputs.use_existing_tag }})'

# Used for releasing the tools/foas Go library module. Creates a single tag
# `tools/foas/vX.Y.Z` so external Go consumers (e.g. mcp-server in
# `mongodb-labs/oasis`) can pin the library at a stable version. No binary
# is produced — see release-cli.yml for the foascli binary release.
on:
  workflow_dispatch:
    inputs:
      version_number:
        description: 'Version number (e.g., v1.0.0, v1.0.0-pre, v1.0.0-pre1)'
        required: true
      skip_tests:
        description: 'Set value to `true` to skip tests, default is `false`'
        default: 'false'
      use_existing_tag:
        description: 'Set value to `true` to use an existing tag for the release process, default is `false`'
        default: 'false'

jobs:
  create-tag:
    runs-on: ubuntu-latest
    if: >-
      !cancelled()
      && inputs.use_existing_tag == 'false'
    steps:
      - name: Validation of version format
        run: |
          echo "${{ inputs.version_number }}" | grep -P '^v\d+\.\d+\.\d+(-pre[A-Za-z0-9-]*)?$'
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Get the latest commit SHA
        id: get-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create Go submodule tag for tools/foas
        uses: rickstaa/action-create-tag@a1c7777fcb2fee4f19b0f283ba888afa11678b72
        with:
          tag: tools/foas/${{ inputs.version_number }}
          commit_sha: ${{ steps.get-sha.outputs.sha }}
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_passphrase: ${{ secrets.PASSPHRASE }}

  run-tests:
    needs: [ create-tag ]
    if: >-
      !cancelled()
      && !contains(needs.*.result, 'failure')
      && inputs.skip_tests == 'false'
    secrets: inherit
    uses: ./.github/workflows/code-health-foas.yml

  failure-handler:
    name: Failure Handler
    needs: [ run-tests ]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    uses: ./.github/workflows/failure-handler.yml
    with:
      env: "prod"
      release_name: "FOAS"
      team_id: ${{ vars.JIRA_TEAM_ID_APIX_PLATFORM }}
    secrets:
      jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
