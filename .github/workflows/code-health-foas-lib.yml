name: 'Code Health FOAS Library'
on:
  push:
    branches:
      - main
    paths:
      - 'tools/foas/**'
      - '.github/workflows/code-health-foas-lib.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/foas/**'
      - '.github/workflows/code-health-foas-lib.yml'
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: 'tools/foas/go.mod'
    - name: Build library
      working-directory: tools/foas
      run: make build
  unit-tests:
    needs: build
    env:
      COVERAGE: coverage.out
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: 'tools/foas/go.mod'
      - name: Run unit tests
        working-directory: tools/foas
        run: make unit-test
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            .github
            tools
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: 'tools/foas/go.mod'
          cache: false # see https://github.com/golangci/golangci-lint-action/issues/807
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.10.1
          working-directory: tools/foas
