version: 2
updates:
  - package-ecosystem: gomod
    directory: "/tools/cli"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 20
    commit-message:
      prefix: "chore"
  - package-ecosystem: gomod
    directory: "/tools/foas"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 20
    commit-message:
      prefix: "chore"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    commit-message:
      prefix: "chore"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    # Groups only apply to routine version updates. Security updates are
    # left ungrouped so each one opens its own PR and can be prioritized.
    groups:
      spectral:
        applies-to: version-updates
        patterns:
          - "@stoplight/spectral-*"
      babel:
        applies-to: version-updates
        patterns:
          - "@babel/*"
          - "babel-plugin-*"
      eslint:
        applies-to: version-updates
        patterns:
          - "@eslint/*"
          - "eslint"
          - "eslint-plugin-*"
      jest:
        applies-to: version-updates
        patterns:
          - "@jest/*"
          - "jest"
          - "babel-jest"
      aws-sdk:
        applies-to: version-updates
        patterns:
          - "@aws-sdk/*"
          - "aws-sdk-client-mock"
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
  - package-ecosystem: npm
    directory: "/tools/spectral/ipa"
    schedule:
      interval: weekly
      day: tuesday
    # Groups only apply to routine version updates. Security updates are
    # left ungrouped so each one opens its own PR and can be prioritized.
    groups:
      spectral:
        applies-to: version-updates
        patterns:
          - "@stoplight/spectral-*"
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(ipa)"
