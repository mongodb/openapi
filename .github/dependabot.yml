version: 2
updates:
  - package-ecosystem: gomod
    directory: "/tools/cli"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 20
    commit-message:
      prefix: "chore"
  - package-ecosystem: gomod
    directory: "/tools/foas"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 20
    commit-message:
      prefix: "chore"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    commit-message:
      prefix: "chore"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    groups:
      spectral:
        patterns:
          - "@stoplight/spectral-*"
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
  - package-ecosystem: npm
    directory: "/tools/spectral/ipa"
    schedule:
      interval: weekly
      day: tuesday
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(ipa)"
