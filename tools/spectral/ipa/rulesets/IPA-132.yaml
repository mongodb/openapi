# IPA-132: Long-Running Operations
# https://mongodb.github.io/ipa/132

functions:
  - IPA132OperationsEndpointMustNotBeGlobal
  - IPA132OperationMustBeAReadOnlyResource
  - IPA132OperationsEndpointMustBeALeafResource
  - IPA132OperationEndpointsMustReturnOperationResponse
  - IPA132OperationResponseMustNotUseComposition
  - IPA132OperationResponseMustDefineRequiredFields
  - IPA132OperationResponseMustDefineOptionalFields
  - IPA132OperationResponseMustUseStandardEnumValues
  - IPA132OperationResponseMustDefineNestedObjectStructure
  - IPA132OperationsShouldExposeStatusFields
  - IPA132GetMethodMustNotBeLro
  - IPA132ListMethodMustNotBeLro
  - IPA132OperationsEndpointMustNotDefineCustomMethods

aliases:
  OperationResponseSchema:
    - '$.components.schemas.OperationResponse'
  GetOperationObject:
    - '$.paths[*].get'

rules:
  xgen-IPA-132-operations-endpoint-must-not-be-global:
    description: |
      Operations endpoints must not be defined as standalone, global endpoints with no parent
      resource in their path.

      ##### Implementation details
      Rule checks for the following conditions:

        - Applies to Operations endpoints, i.e. paths ending with an `operations` segment or an
          `operations/{operationId}` suffix
        - The `operations` segment must be preceded by at least one parent resource segment
        - A root-level Operations endpoint, such as `/api/atlas/v2/operations` or
          `/api/atlas/v2/unauth/operations`, is a violation
        - Paths with `x-xgen-IPA-exception` for this rule are excluded from validation

    message: '{{error}} https://mdb.link/mongodb-atlas-openapi-validation#xgen-IPA-132-operations-endpoint-must-not-be-global'
    severity: warn
    given: $.paths
    then:
      field: '@key'
      function: IPA132OperationsEndpointMustNotBeGlobal

  xgen-IPA-132-operation-must-be-a-read-only-resource:
    description: |
      Operations endpoints are read-only. They may only define the get method, and all properties
      of the Operation resource must be readOnly.

      ##### Implementation details
      Rule checks for the following conditions:

        - Applies to Operations endpoints, i.e. paths ending with an `operations` segment or an
          `operations/{operationId}` suffix
        - The path item must not define any HTTP method other than `get`
        - On the single Operation endpoint (`.../operations/{operationId}`), where the Get method
          is defined, all properties of every 2xx response schema of the `get` method must be
          marked as `readOnly: true`
        - Paths with `x-xgen-IPA-exception` for this rule are excluded from validation

    message: '{{error}} https://mdb.link/mongodb-atlas-openapi-validation#xgen-IPA-132-operation-must-be-a-read-only-resource'
    severity: warn
    given: $.paths
    then:
      field: '@key'
      function: IPA132OperationMustBeAReadOnlyResource

  xgen-IPA-132-operations-endpoint-must-be-a-leaf-resource:
    description: |
      Operations endpoints must be leaf resources, with no resources nested below them.

      ##### Implementation details
      Rule checks for the following conditions:

        - Applies to paths containing an `operations` segment
        - An `operations` segment may only be followed by a single operation identifier path
          parameter, e.g. `.../operations` and `.../operations/{operationId}` are valid
        - Any further nesting, such as `.../operations/subresource` or
          `.../operations/{operationId}/subresource`, is a violation
        - Paths with `x-xgen-IPA-exception` for this rule are excluded from validation

    message: '{{error}} https://mdb.link/mongodb-atlas-openapi-validation#xgen-IPA-132-operations-endpoint-must-be-a-leaf-resource'
    severity: warn
    given: $.paths
    then:
      field: '@key'
      function: IPA132OperationsEndpointMustBeALeafResource

  xgen-IPA-132-operation-endpoints-must-return-operation-response:
    description: |
      Operation endpoints must return the OperationResponse schema to report long-running
      operation status.

      ##### Implementation details
      Rule checks for the following conditions:

        - Applies to 2xx responses of GET methods on Operations endpoints; the response content
          is defined inline, `components.responses` is reserved for error responses
        - Every 2xx response must define at least one JSON media type carrying a schema
        - The single Operation endpoint (`.../operations/{operationId}`) must reference the
          `OperationResponse` schema
        - The Operations collection endpoint (`.../operations`) must reference a paginated wrapper
          schema that defines the `results` array directly; inline and `allOf`-composed wrappers
          are rejected, consistent with `xgen-IPA-110-collections-use-paginated-prefix` and
          `xgen-IPA-110-collections-response-define-results-array`
        - Inline Operation schemas are violations, the response must reference the predefined
          `OperationResponse` schema
        - Responses with `x-xgen-IPA-exception` for this rule at the response level are excluded
          from validation

    message: '{{error}} https://mdb.link/mongodb-atlas-openapi-validation#xgen-IPA-132-operation-endpoints-must-return-operation-response'
    severity: warn
    given: $.paths[*].get.responses
    then:
      field: '@key'
      function: IPA132OperationEndpointsMustReturnOperationResponse

  xgen-IPA-132-operation-response-must-not-use-composition:
    description: |
      The OperationResponse schema must define its properties directly. There is one and only one
      OperationResponse, so allOf, oneOf and anyOf composition is a violation.

      ##### Implementation details
      Rule checks for the following conditions:

        - Applies to the OperationResponse component schema
        - The schema must not use allOf, oneOf or anyOf composition
        - The other OperationResponse schema rules skip composed schemas, relying on this rule to
          reject them
        - Schemas with `x-xgen-IPA-exception` for this rule are excluded from validation

    message: '{{error}} https://mdb.link/mongodb-atlas-openapi-validation#xgen-IPA-132-operation-response-must-not-use-composition'
    severity: warn
    given: '#OperationResponseSchema'
    then:
      function: IPA132OperationResponseMustNotUseComposition

  xgen-IPA-132-operation-response-must-define-required-fields:
    description: |
      The OperationResponse schema must define every field the IPA-132 standard marks as always
      required: operationId, status, operationType, createdAt, updatedAt and expiresAt.

      ##### Implementation details
      Rule checks for the following conditions:

        - Applies to the OperationResponse component schema
        - Each field listed in the rule's functionOptions must be defined and listed as required
        - Composed schemas are skipped: composition is rejected by the must-not-use-composition
          rule
        - For expiresAt, only the field declaration is validated; the retention behavior and the
          404 after expiry are backend-defined
        - Schemas with `x-xgen-IPA-exception` for this rule are excluded from validation

    message: '{{error}} https://mdb.link/mongodb-atlas-openapi-validation#xgen-IPA-132-operation-response-must-define-required-fields'
    severity: warn
    given: '#OperationResponseSchema'
    then:
      function: IPA132OperationResponseMustDefineRequiredFields
      functionOptions:
        fields:
          - operationId
          - status
          - operationType
          - createdAt
          - updatedAt
          - expiresAt

  xgen-IPA-132-operation-response-must-define-optional-fields:
    description: |
      The OperationResponse schema must define every field the IPA-132 standard marks as
      conditionally present, and none of them may be listed as required: customMethod, error,
      resultHref and retryAfterSeconds are present only under runtime conditions.

      ##### Implementation details
      Rule checks for the following conditions:

        - Applies to the OperationResponse component schema
        - Each field listed in the rule's functionOptions must be defined and must not be listed
          as required: the condition under which it is present is a runtime state that cannot be
          validated statically
        - Composed schemas are skipped: composition is rejected by the must-not-use-composition
          rule
        - Schemas with `x-xgen-IPA-exception` for this rule are excluded from validation

    message: '{{error}} https://mdb.link/mongodb-atlas-openapi-validation#xgen-IPA-132-operation-response-must-define-optional-fields'
    severity: warn
    given: '#OperationResponseSchema'
    then:
      function: IPA132OperationResponseMustDefineOptionalFields
      functionOptions:
        fields:
          - name: customMethod
            condition: when operationType is CUSTOM
          - name: error
            condition: when the operation has FAILED
          - name: resultHref
            condition: when the operation has SUCCEEDED
          - name: retryAfterSeconds
            condition: while the operation is in a non-terminal state

  xgen-IPA-132-operation-response-must-use-standard-enum-values:
    description: |
      Every enum field of the OperationResponse schema must use exactly the standard enum values
      defined by IPA-132: the status lifecycle enum, the operationType enum and the retryStrategy
      enum of the error object.

      ##### Implementation details
      Rule checks for the following conditions:

        - Applies to the OperationResponse component schema
        - Each enum field listed in the rule's functionOptions must use exactly the listed values,
          in any order
        - Fields that are not defined are skipped: top-level field presence is validated by the
          required-fields and optional-fields rules
        - Composed schemas are skipped: composition is rejected by the must-not-use-composition
          rule
        - Schemas with `x-xgen-IPA-exception` for this rule are excluded from validation

    message: '{{error}} https://mdb.link/mongodb-atlas-openapi-validation#xgen-IPA-132-operation-response-must-use-standard-enum-values'
    severity: warn
    given: '#OperationResponseSchema'
    then:
      function: IPA132OperationResponseMustUseStandardEnumValues
      functionOptions:
        enums:
          - field: status
            values: [PENDING, IN_PROGRESS, SUCCEEDED, FAILED, CANCELED, SUPERSEDED]
          - field: operationType
            values: [CREATE, UPDATE, DELETE, CUSTOM]
          - field: retryStrategy
            parent: error
            values: [IMMEDIATE, BACKOFF, NONE]

  xgen-IPA-132-operation-response-must-define-nested-object-structure:
    description: |
      Every nested object field of the OperationResponse schema must define the properties the
      IPA-132 standard requires of it: the error object must define code, message and retryable.

      ##### Implementation details
      Rule checks for the following conditions:

        - Applies to the OperationResponse component schema
        - Each nested object field listed in the rule's functionOptions must define the listed
          properties
        - Fields that are not defined are skipped: their presence is validated by the
          optional-fields rule
        - Composed schemas are skipped: composition is rejected by the must-not-use-composition
          rule
        - Schemas with `x-xgen-IPA-exception` for this rule are excluded from validation

    message: '{{error}} https://mdb.link/mongodb-atlas-openapi-validation#xgen-IPA-132-operation-response-must-define-nested-object-structure'
    severity: warn
    given: '#OperationResponseSchema'
    then:
      function: IPA132OperationResponseMustDefineNestedObjectStructure
      functionOptions:
        objects:
          - field: error
            properties: [code, message, retryable]

  xgen-IPA-132-operations-should-expose-status-fields:
    description: |
      An Operation should expose statusMessage, progress, and estimatedCompletionTime so clients
      can reason about in-flight work.

      ##### Implementation details
      Rule checks for the following conditions:

        - Applies to the OperationResponse component schema
        - The schema should define the fields listed in the rule's functionOptions:
          `statusMessage`, `progress` and `estimatedCompletionTime`
        - The progress object should define `completed`, `total` and `unit` properties
        - Kept separate from the must-level rules because it enforces should-level guidance
        - Composed schemas are skipped: composition is rejected by the must-not-use-composition
          rule
        - Schemas with `x-xgen-IPA-exception` for this rule are excluded from validation

    message: '{{error}} https://mdb.link/mongodb-atlas-openapi-validation#xgen-IPA-132-operations-should-expose-status-fields'
    severity: warn
    given: '#OperationResponseSchema'
    then:
      function: IPA132OperationsShouldExposeStatusFields
      functionOptions:
        fields: [statusMessage, progress, estimatedCompletionTime]
        objects:
          - field: progress
            properties: [completed, total, unit]

  xgen-IPA-132-get-method-must-not-be-lro:
    description: |
      A Get method must not be a long-running operation. A Get returns the current state of a
      single resource that already resides on the server.

      ##### Implementation details
      Rule checks for the following conditions:

        - Applies to GET methods on single resources and singleton resources
        - The Get method must not declare a 202 response; a Get reads state that already exists on
          the server, so there is no background work to track
        - Operations with `x-xgen-IPA-exception` for this rule are excluded from validation

    message: '{{error}} https://mdb.link/mongodb-atlas-openapi-validation#xgen-IPA-132-get-method-must-not-be-lro'
    severity: warn
    given: '#GetOperationObject'
    then:
      function: IPA132GetMethodMustNotBeLro

  xgen-IPA-132-list-method-must-not-be-lro:
    description: |
      A List method must not be a long-running operation. A List returns data from a collection
      that already exists on the server.

      ##### Implementation details
      Rule checks for the following conditions:

        - Applies to GET methods on resource collections
        - The List method must not declare a 202 response; a List returns existing collection
          data, so the response is returned within the request cycle
        - Operations with `x-xgen-IPA-exception` for this rule are excluded from validation

    message: '{{error}} https://mdb.link/mongodb-atlas-openapi-validation#xgen-IPA-132-list-method-must-not-be-lro'
    severity: warn
    given: '#GetOperationObject'
    then:
      function: IPA132ListMethodMustNotBeLro

  xgen-IPA-132-operations-endpoint-must-not-define-custom-methods:
    description: |
      Operations endpoints must not define custom methods. Control actions require mutating
      methods, which the read-only Operations resource does not allow.

      ##### Implementation details
      Rule checks for the following conditions:

        - Applies to custom method paths (`:customMethod`) whose resource identifier, the part
          before the colon, is an Operations endpoint, i.e. ends with an `operations` segment or
          an `operations/{operationId}` suffix
        - Any custom method attached to the Operations collection or to a single Operation is a
          violation
        - Paths with `x-xgen-IPA-exception` for this rule are excluded from validation

    message: '{{error}} https://mdb.link/mongodb-atlas-openapi-validation#xgen-IPA-132-operations-endpoint-must-not-define-custom-methods'
    severity: warn
    given: $.paths
    then:
      field: '@key'
      function: IPA132OperationsEndpointMustNotDefineCustomMethods
