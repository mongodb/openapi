    - description: |-
        Create and return Atlas Ephemeral clusters. An Ephemeral cluster is a temporary Atlas Free cluster that you can claim within 7 days to convert into a standard Free cluster.

        Use of this API, including any resources created through it, is governed by MongoDB’s [Cloud Terms of Service](https://www.mongodb.com/legal/terms-and-conditions/cloud) and [Privacy Policy](https://www.mongodb.com/legal/privacy/privacy-policy). By using this API to create an Ephemeral cluster, you agree to these terms.

        To learn more about Ephemeral clusters, see [Create an Atlas Ephemeral Cluster](https://dochub.mongodb.org/core/create-ephemeral-cluster) in the MongoDB Atlas documentation.
      name: Ephemeral Clusters
    - description: Returns User-Configurable Project Limits.
      name: Limit Description
    - description: You can continually export mongod, mongos, and audit logs to an AWS S3 bucket. The new `/logIntegrations` API provides 1-minute log export on a best-effort basis. The existing `/pushBasedLogExport` API provides 5-minute log export and will be deprecated in the future. The log export integrations are managed at the project level.
      name: Push-Based Log Export
    - description: Returns, adds, edits, and removes Streams Workspaces. This resource requires your project ID.
      name: Streams
