components:
    headers:
        HeaderRateLimitLimit:
            description: The maximum number of requests that a user can make within a specific time window.
            schema:
                type: integer
        HeaderRateLimitRemaining:
            description: The number of requests remaining in the current rate limit window before the limit is reached.
            schema:
                type: integer
        HeaderRetryAfter:
            description: The minimum time you should wait, in seconds, before retrying the API request. This header might be returned for 429 or 503 error responses.
            schema:
                type: integer
    parameters:
        collectionName:
            description: Human-readable label that identifies the collection.
            in: path
            name: collectionName
            required: true
            schema:
                example: mycoll
                type: string
        databaseName:
            description: Human-readable label that identifies the database.
            in: path
            name: databaseName
            required: true
            schema:
                example: mydb
                type: string
        end:
            description: Date and time when MongoDB Cloud stops reporting the metrics. This parameter expresses its value in the ISO 8601 timestamp format in UTC. Include this parameter when you do not set **period**.
            in: query
            name: end
            schema:
                format: date-time
                type: string
        envelope:
            description: Flag that indicates whether Application wraps the response in an `envelope` JSON object. Some API clients cannot access the HTTP response headers or status code. To remediate this, set envelope=true in the query. Endpoints that return a list of results use the results object as an envelope. Application adds the status parameter to the response body.
            in: query
            name: envelope
            schema:
                default: false
                type: boolean
        federationSettingsId:
            description: Unique 24-hexadecimal digit string that identifies your federation.
            in: path
            name: federationSettingsId
            required: true
            schema:
                example: 55fa922fb343282757d9554e
                pattern: ^([a-f0-9]{24})$
                type: string
        granularity:
            description: Duration that specifies the interval at which Atlas reports the metrics. This parameter expresses its value in the ISO 8601 duration format in UTC.
            in: query
            name: granularity
            required: true
            schema:
                example: PT1M
                type: string
        groupId:
            description: |-
                Unique 24-hexadecimal digit string that identifies your project. Use the [/groups](#tag/Projects/operation/listProjects) endpoint to retrieve all projects to which the authenticated user has access.

                **NOTE**: Groups and projects are synonymous terms. Your group id is the same as your project id. For existing groups, your group/project id remains the same. The resource and corresponding endpoints use the term groups.
            in: path
            name: groupId
            required: true
            schema:
                example: 32b6e34b3d91647abb20e7b8
                pattern: ^([a-f0-9]{24})$
                type: string
        identityProviderId:
            description: Legacy 20-hexadecimal digit string that identifies the identity provider. This id can be found within the Federation Management Console > Identity Providers tab by clicking the info icon in the IdP ID row of a configured identity provider.
            in: path
            name: identityProviderId
            required: true
            schema:
                example: c2777a9eca931f29fc2f
                pattern: ^([a-f0-9]{20})$
                type: string
        includeCount:
            description: Flag that indicates whether MongoDB Cloud calculates the total number of items for the response. When set to `false`, MongoDB Cloud may skip an additional count operation. The response may still include `totalCount` when the count is available without additional calculation.
            in: query
            name: includeCount
            schema:
                default: true
                type: boolean
        indexName:
            description: Human-readable label that identifies the index.
            in: path
            name: indexName
            required: true
            schema:
                example: myindex
                type: string
        itemsPerPage:
            description: Number of items that the response returns per page.
            in: query
            name: itemsPerPage
            schema:
                default: 100
                maximum: 500
                minimum: 1
                type: integer
        liveMigrationId:
            description: Unique 24-hexadecimal digit string that identifies the migration.
            in: path
            name: liveMigrationId
            required: true
            schema:
                example: 6296fb4c7c7aa997cf94e9a8
                pattern: ^([a-f0-9]{24})$
                type: string
        orgId:
            description: Unique 24-hexadecimal digit string that identifies the organization that contains your projects. Use the [`/orgs`](#tag/Organizations/operation/listOrganizations) endpoint to retrieve all organizations to which the authenticated user has access.
            in: path
            name: orgId
            required: true
            schema:
                example: 4888442a3354817a7320eb61
                pattern: ^([a-f0-9]{24})$
                type: string
        pageNum:
            description: Number of the page that displays the current set of the total objects that the response returns.
            in: query
            name: pageNum
            schema:
                default: 1
                minimum: 1
                type: integer
        period:
            description: Duration over which Atlas reports the metrics. This parameter expresses its value in the ISO 8601 duration format in UTC. Include this parameter when you do not set **start** and **end**.
            in: query
            name: period
            schema:
                example: PT10H
                type: string
        pretty:
            description: Flag that indicates whether the response body should be in the prettyprint format.
            in: query
            name: pretty
            schema:
                default: false
                externalDocs:
                    description: Prettyprint
                    url: https://en.wikipedia.org/wiki/Prettyprint
                type: boolean
        processId:
            description: Combination of hostname and IANA port that serves the MongoDB process. The host must be the hostname, fully qualified domain name (FQDN), or Internet Protocol address (IPv4 or IPv6) of the host that runs the MongoDB process (mongod or mongos). The port must be the IANA port on which the MongoDB process listens for requests.
            in: path
            name: processId
            required: true
            schema:
                example: my.host.name.com:27017
                pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}|([0-9a-f]{1,4}\:){7}([0-9a-f]{1,4})|(([a-z0-9]+\.){1,10}[a-z]+)?(\:[0-9]{4,5})$
                type: string
        sandboxConfigId:
            description: Unique 24-hexadecimal digit string that identifies the sandbox configuration.
            in: path
            name: sandboxConfigId
            required: true
            schema:
                example: 507f1f77bcf86cd799439011
                pattern: ^([a-f0-9]{24})$
                type: string
        start:
            description: Date and time when MongoDB Cloud begins reporting the metrics. This parameter expresses its value in the ISO 8601 timestamp format in UTC. Include this parameter when you do not set **period**.
            in: query
            name: start
            schema:
                format: date-time
                type: string
    responses:
        accepted:
            description: Accepted.
        badRequest:
            content:
                application/json:
                    example:
                        detail: (This is just an example, the exception may not be related to this endpoint) No provider AWS exists.
                        error: 400
                        errorCode: VALIDATION_ERROR
                        reason: Bad Request
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Bad Request.
        conflict:
            content:
                application/json:
                    example:
                        detail: '(This is just an example, the exception may not be related to this endpoint) Cannot delete organization link while there is active migration in following project ids: 60c4fd418ebe251047c50554'
                        error: 409
                        errorCode: CANNOT_DELETE_ORG_ACTIVE_LIVE_MIGRATION_ATLAS_ORG_LINK
                        reason: Conflict
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Conflict.
        forbidden:
            content:
                application/json:
                    example:
                        detail: (This is just an example, the exception may not be related to this endpoint)
                        error: 403
                        errorCode: CANNOT_CHANGE_GROUP_NAME
                        reason: Forbidden
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Forbidden.
        gone:
            content:
                application/json:
                    example:
                        detail: This happens when a resource is marked for sunset and the sunset date is in the past.
                        error: 410
                        errorCode: VERSION_GONE
                        reason: Gone
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Gone.
        internalServerError:
            content:
                application/json:
                    example:
                        detail: (This is just an example, the exception may not be related to this endpoint)
                        error: 500
                        errorCode: UNEXPECTED_ERROR
                        reason: Internal Server Error
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Internal Server Error.
        methodNotAllowed:
            content:
                application/json:
                    example:
                        detail: (This is just an example, the exception may not be related to this endpoint)
                        error: 405
                        errorCode: ATLAS_BACKUP_CANCEL_SHARD_RESTORE_JOB_NOT_ALLOWED
                        reason: Method Not Allowed
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Method Not Allowed.
        notFound:
            content:
                application/json:
                    example:
                        detail: (This is just an example, the exception may not be related to this endpoint) Cannot find resource AWS
                        error: 404
                        errorCode: RESOURCE_NOT_FOUND
                        reason: Not Found
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Not Found.
        paymentRequired:
            content:
                application/json:
                    example:
                        detail: (This is just an example, the exception may not be related to this endpoint)
                        error: 402
                        errorCode: NO_PAYMENT_INFORMATION_FOUND
                        reason: Payment Required
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Payment Required.
        serviceUnavailable:
            content:
                application/json:
                    example:
                        detail: (This is just an example, the exception may not be related to this endpoint)
                        error: 503
                        errorCode: SERVICE_UNAVAILABLE
                        reason: Service Unavailable
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Service Unavailable.
        tooManyRequests:
            content:
                application/json:
                    example:
                        detail: (This is just an example, the exception may not be related to this endpoint)
                        error: 429
                        errorCode: RATE_LIMITED
                        reason: Too Many Requests
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Too Many Requests.
            headers:
                RateLimit-Limit:
                    $ref: '#/components/headers/HeaderRateLimitLimit'
                RateLimit-Remaining:
                    $ref: '#/components/headers/HeaderRateLimitRemaining'
                Retry-After:
                    $ref: '#/components/headers/HeaderRetryAfter'
        unauthorized:
            content:
                application/json:
                    example:
                        detail: (This is just an example, the exception may not be related to this endpoint)
                        error: 401
                        errorCode: NOT_ORG_GROUP_CREATOR
                        reason: Unauthorized
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Unauthorized.
    schemas:
        ApiError:
            properties:
                badRequestDetail:
                    $ref: '#/components/schemas/BadRequestDetail'
                detail:
                    description: Describes the specific conditions or reasons that cause each type of error.
                    nullable: true
                    type: string
                error:
                    description: HTTP status code returned with this error.
                    externalDocs:
                        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status
                    format: int32
                    readOnly: true
                    type: integer
                errorCode:
                    description: Application error code returned with this error.
                    readOnly: true
                    type: string
                parameters:
                    description: Parameters used to give more information about the error.
                    items:
                        type: object
                    readOnly: true
                    type: array
                reason:
                    description: Application error message returned with this error.
                    nullable: true
                    readOnly: true
                    type: string
            required:
                - error
                - errorCode
            type: object
        AutoEmbeddingConfiguredInferenceScope:
            description: Configured cloud and geographic dimensions. Both values are AUTO when Atlas selects the scope.
            properties:
                cloud:
                    description: Configured cloud provider scope.
                    enum:
                        - AUTO
                        - ANY
                        - AWS
                    type: string
                geography:
                    description: Configured geographic scope.
                    enum:
                        - AUTO
                        - ANY
                        - EU
                        - US
                    type: string
            required:
                - cloud
                - geography
            type: object
        AutoEmbeddingEffectiveInferenceScope:
            description: Cloud and geographic dimensions that Atlas applies to this cluster.
            properties:
                cloud:
                    description: Effective cloud provider scope.
                    enum:
                        - ANY
                        - AWS
                    readOnly: true
                    type: string
                geography:
                    description: Effective geographic scope.
                    enum:
                        - ANY
                        - EU
                        - US
                    readOnly: true
                    type: string
            readOnly: true
            required:
                - cloud
                - geography
            type: object
        AutoEmbeddingInferenceScopeResponse:
            description: Configured and effective inference scope for Auto-Embedding indexes on one cluster.
            properties:
                configured:
                    $ref: '#/components/schemas/AutoEmbeddingConfiguredInferenceScope'
                effective:
                    $ref: '#/components/schemas/AutoEmbeddingEffectiveInferenceScope'
                mutable:
                    description: Flag that indicates whether the inference scope can be configured.
                    readOnly: true
                    type: boolean
                reason:
                    description: Reason code that explains why the inference scope cannot be configured.
                    enum:
                        - UNSUPPORTED_QUERY_TIER
                        - UNSUPPORTED_CLUSTER_TYPE
                    nullable: true
                    readOnly: true
                    type: string
                source:
                    description: Source from which Atlas derived the effective inference scope.
                    enum:
                        - DEFAULT
                        - CONFIGURED
                    readOnly: true
                    type: string
            required:
                - configured
                - effective
                - mutable
                - source
            type: object
        AutoEmbeddingInferenceScopeUpdateRequest:
            properties:
                configured:
                    $ref: '#/components/schemas/AutoEmbeddingInferenceScopeUpdateRequestConfigured'
            type: object
        AutoEmbeddingInferenceScopeUpdateRequestConfigured:
            description: Cloud and geographic dimensions to configure atomically.
            properties:
                cloud:
                    description: Cloud provider scope.
                    enum:
                        - AUTO
                        - ANY
                        - AWS
                    type: string
                geography:
                    description: Geographic scope.
                    enum:
                        - AUTO
                        - ANY
                        - EU
                        - US
                    type: string
            required:
                - cloud
                - geography
            type: object
        BadRequestDetail:
            description: Bad request detail.
            properties:
                fields:
                    description: Describes all violations in a client request.
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    type: array
            readOnly: true
            type: object
        CreateEphemeralClusterRequest:
            description: Create an Atlas Ephemeral cluster.
            properties:
                clusterName:
                    description: Human-readable label that identifies the Ephemeral cluster. Defaults to `Cluster0`.
                    nullable: true
                    pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]*$
                    type: string
            type: object
        DefaultGroupLimitResponse:
            description: General information about a project-level, user-configured limit, including its name, maximum value, default value, and a description.
            properties:
                defaultLimit:
                    description: Default limit value. Returns null if no default exists.
                    format: int32
                    nullable: true
                    readOnly: true
                    type: integer
                description:
                    description: Human-friendly description of what the limit controls.
                    readOnly: true
                    type: string
                maximumLimit:
                    description: Maximum limit value. Returns null if no maximum exists.
                    format: int32
                    nullable: true
                    readOnly: true
                    type: integer
                name:
                    description: Human-readable label that identifies the user-managed limit.
                    readOnly: true
                    type: string
            title: Group limit description
            type: object
        EphemeralClusterCreated:
            description: Details for the Atlas Ephemeral cluster that was created.
            properties:
                claimUrl:
                    description: Unique URL for claiming this Ephemeral cluster. Redirects to the Atlas sign-in or registration page, where a user signs in or creates an account to claim the cluster. Valid for 7 days after the cluster is created.
                    format: uri
                    type: string
                clusterId:
                    description: Unique identifier of the Ephemeral cluster. Use this ID to retrieve the cluster's status and details in a GET request.
                    type: string
                connectionString:
                    description: Connection string that uses the `mongodb+srv://` protocol to connect to the Ephemeral cluster. This string includes the unredacted SCRAM credentials (username and password) for an automatically generated database user that Atlas grants the built-in `readWriteAnyDatabase` role.
                    type: string
                expiresAt:
                    description: Date and time when the cluster will be paused and no longer accessible until it is claimed. This parameter expresses its value in the ISO 8601 timestamp format in UTC.
                    format: date-time
                    type: string
                status:
                    description: Status of the Ephemeral cluster.
                    enum:
                        - ACTIVE
                        - PROVISIONING
                    type: string
                termsOfService:
                    description: Notice that by using this API, you agree to MongoDB's Cloud Terms of Service at <https://www.mongodb.com/legal/terms-and-conditions/cloud> and Privacy Policy at <https://www.mongodb.com/legal/privacy/privacy-policy>.
                    type: string
            type: object
        EphemeralClusterStatusResponse:
            description: Current status and details of an ephemeral Atlas cluster.
            properties:
                claimUrl:
                    description: Unique URL for claiming this Ephemeral cluster. Redirects to the Atlas sign-in or registration page, where a user signs in or creates an account to claim the cluster. Valid for 7 days after the cluster is created.
                    format: uri
                    type: string
                clusterId:
                    description: Unique identifier of the Ephemeral cluster. Use this ID to retrieve the cluster's status and details in a GET request.
                    type: string
                connectionString:
                    description: Connection string that uses the `mongodb+srv://` protocol to connect to the Ephemeral cluster. This string includes the SCRAM username of an automatically generated database user, but replaces the password with a placeholder. Atlas returns the password only in the create response.
                    nullable: true
                    type: string
                expiresAt:
                    description: Date and time when the cluster will be paused and no longer accessible until it is claimed. This parameter expresses its value in the ISO 8601 timestamp format in UTC.
                    format: date-time
                    type: string
                status:
                    description: Status of the Ephemeral cluster.
                    enum:
                        - PROVISIONING
                        - ACTIVE
                        - PAUSED
                    type: string
                termsOfService:
                    description: Notice that by using this API, you agree to MongoDB's Cloud Terms of Service at <https://www.mongodb.com/legal/terms-and-conditions/cloud> and Privacy Policy at <https://www.mongodb.com/legal/privacy/privacy-policy>.
                    type: string
            type: object
        FieldViolation:
            properties:
                description:
                    description: A description of why the request element is bad.
                    type: string
                field:
                    description: A path that leads to a field in the request body.
                    type: string
            required:
                - description
                - field
            type: object
        Link:
            properties:
                href:
                    description: Uniform Resource Locator (URL) that points another API resource to which this response has some relationship. This URL often begins with `https://cloud.mongodb.com/api/atlas`.
                    example: https://cloud.mongodb.com/api/atlas
                    type: string
                rel:
                    description: Uniform Resource Locator (URL) that defines the semantic relationship between this resource and another API resource. This URL often begins with `https://cloud.mongodb.com/api/atlas`.
                    example: self
                    type: string
            type: object
        OperationError:
            description: Details about a failed operation.
            properties:
                code:
                    description: Machine-readable error code.
                    type: string
                details:
                    additionalProperties:
                        description: Additional error details.
                        type: object
                    description: Additional error details.
                    nullable: true
                    type: object
                message:
                    description: Human-readable error message.
                    type: string
                retryStrategy:
                    description: Recommended strategy for retrying the operation.
                    enum:
                        - IMMEDIATE
                        - BACKOFF
                        - NONE
                    nullable: true
                    type: string
                retryable:
                    description: Flag that indicates whether the operation can be retried.
                    type: boolean
            readOnly: true
            required:
                - code
                - message
                - retryable
            type: object
        OperationProgress:
            description: Progress made by an active operation.
            properties:
                completed:
                    description: Number of completed units.
                    format: int32
                    type: integer
                total:
                    description: Total number of units.
                    format: int32
                    type: integer
                unit:
                    description: Unit measured by completed and total.
                    type: string
            readOnly: true
            type: object
        OperationResponse:
            description: Status of a long-running operation.
            properties:
                createdAt:
                    description: Creation time in ISO 8601 timestamp format in UTC.
                    format: date-time
                    readOnly: true
                    type: string
                customMethod:
                    description: Name of a custom operation. Required for CUSTOM operations.
                    nullable: true
                    readOnly: true
                    type: string
                error:
                    $ref: '#/components/schemas/OperationError'
                estimatedCompletionTime:
                    description: Estimated completion time in ISO 8601 timestamp format in UTC.
                    format: date-time
                    nullable: true
                    readOnly: true
                    type: string
                expiresAt:
                    description: Expiration time in ISO 8601 timestamp format in UTC.
                    format: date-time
                    readOnly: true
                    type: string
                operationId:
                    description: Unique identifier of the operation.
                    readOnly: true
                    type: string
                operationType:
                    description: Type of mutation performed by the operation.
                    enum:
                        - CREATE
                        - UPDATE
                        - DELETE
                        - CUSTOM
                    readOnly: true
                    type: string
                progress:
                    $ref: '#/components/schemas/OperationProgress'
                resultHref:
                    description: URI of the affected resource. Required when status is SUCCEEDED.
                    format: uri
                    nullable: true
                    readOnly: true
                    type: string
                retryAfterSeconds:
                    description: Recommended polling delay. Required while the operation is active.
                    format: int32
                    minimum: 1
                    nullable: true
                    readOnly: true
                    type: integer
                status:
                    description: State of the operation.
                    enum:
                        - PENDING
                        - IN_PROGRESS
                        - SUCCEEDED
                        - FAILED
                        - CANCELED
                        - SUPERSEDED
                    readOnly: true
                    type: string
                statusMessage:
                    description: Human-readable operation status.
                    nullable: true
                    readOnly: true
                    type: string
                updatedAt:
                    description: Last update time in ISO 8601 timestamp format in UTC.
                    format: date-time
                    readOnly: true
                    type: string
            required:
                - createdAt
                - expiresAt
                - operationId
                - operationType
                - status
                - updatedAt
            type: object
        OrgLogIntegrationHeader:
            description: HTTP header with name and value.
            properties:
                name:
                    description: Header name.
                    example: Authorization
                    type: string
                value:
                    description: Header value. Redacted in responses.
                    example: Bearer token123
                    format: password
                    type: string
            required:
                - name
                - value
            type: object
        OrgLogIntegrationRequest:
            description: Request schema for creating an organization-level log integration.
            discriminator:
                mapping:
                    OTEL_LOG_EXPORT: '#/components/schemas/OrgOtelLogIntegrationRequest'
                propertyName: type
            oneOf:
                - $ref: '#/components/schemas/OrgOtelLogIntegrationRequest'
            properties:
                logTypes:
                    description: Array of log types exported by this integration.
                    example:
                        - EVENTS
                    items:
                        enum:
                            - EVENTS
                        type: string
                    maxItems: 1
                    type: array
                    uniqueItems: true
                type:
                    description: Type of log integration. Identifies which service will receive the exported events. This value cannot be modified after the integration is created.
                    enum:
                        - OTEL_LOG_EXPORT
                    type: string
            required:
                - logTypes
                - type
            title: Organization Log Integration Request
            type: object
        OrgLogIntegrationResponse:
            description: Response schema for organization-level log integration operations.
            discriminator:
                mapping:
                    OTEL_LOG_EXPORT: '#/components/schemas/OrgOtelLogIntegrationResponse'
                propertyName: type
            oneOf:
                - $ref: '#/components/schemas/OrgOtelLogIntegrationResponse'
            properties:
                id:
                    description: Unique 24-character hexadecimal digit string that identifies the log integration configuration.
                    example: 507f1f77bcf86cd799439011
                    readOnly: true
                    type: string
                logTypes:
                    description: Array of log types exported by this integration.
                    example:
                        - EVENTS
                    items:
                        enum:
                            - EVENTS
                        type: string
                    maxItems: 1
                    type: array
                    uniqueItems: true
                type:
                    description: Type of log integration. Identifies which service will receive the exported events. This value cannot be modified after the integration is created.
                    enum:
                        - OTEL_LOG_EXPORT
                    type: string
            required:
                - id
                - logTypes
                - type
            title: Organization Log Integration Response
            type: object
        OrgLogIntegrationUpdateRequest:
            description: Request schema for updating an organization-level log integration.
            discriminator:
                mapping:
                    OTEL_LOG_EXPORT: '#/components/schemas/OrgOtelLogIntegrationUpdateRequest'
                propertyName: type
            oneOf:
                - $ref: '#/components/schemas/OrgOtelLogIntegrationUpdateRequest'
            properties:
                logTypes:
                    description: Array of log types exported by this integration.
                    example:
                        - EVENTS
                    items:
                        enum:
                            - EVENTS
                        type: string
                    maxItems: 1
                    type: array
                    uniqueItems: true
                type:
                    description: Type of log integration. Identifies which service will receive the exported events. This value cannot be modified after the integration is created.
                    enum:
                        - OTEL_LOG_EXPORT
                    type: string
            required:
                - logTypes
                - type
            title: Organization Log Integration Update Request
            type: object
        OrgOtelLogIntegrationRequest:
            allOf:
                - $ref: '#/components/schemas/OrgLogIntegrationRequest'
                - properties:
                    otelEndpoint:
                        description: OpenTelemetry collector endpoint URL. Must be HTTPS and not exceed 2048 characters.
                        example: https://otel-collector.example.com:4318/v1/logs
                        type: string
                    otelSuppliedHeaders:
                        description: HTTP headers for authentication and configuration. Maximum 10 headers, total size limit 2KB.
                        items:
                            $ref: '#/components/schemas/OrgLogIntegrationHeader'
                        maxItems: 10
                        minItems: 1
                        type: array
                    type:
                        description: Human-readable label that identifies the service to which you want to integrate with Atlas. The value must match the log integration type. This value cannot be modified after the integration is created.
                        enum:
                            - OTEL_LOG_EXPORT
                        type: string
                  type: object
            description: Request schema for creating an organization-level OpenTelemetry log integration.
            required:
                - logTypes
                - otelEndpoint
                - otelSuppliedHeaders
                - type
            title: Organization OTel Log Integration Request
            type: object
        OrgOtelLogIntegrationResponse:
            allOf:
                - $ref: '#/components/schemas/OrgLogIntegrationResponse'
                - properties:
                    otelEndpoint:
                        description: OpenTelemetry collector endpoint URL.
