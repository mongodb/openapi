components:
    headers:
        HeaderRateLimitLimit:
            description: The maximum number of requests that a user can make within a specific time window.
            schema:
                type: integer
        HeaderRateLimitRemaining:
            description: The number of requests remaining in the current rate limit window before the limit is reached.
            schema:
                type: integer
        HeaderRetryAfter:
            description: The minimum time you should wait, in seconds, before retrying the API request. This header might be returned for 429 or 503 error responses.
            schema:
                type: integer
    parameters:
        collectionName:
            description: Human-readable label that identifies the collection.
            in: path
            name: collectionName
            required: true
            schema:
                example: mycoll
                type: string
        databaseName:
            description: Human-readable label that identifies the database.
            in: path
            name: databaseName
            required: true
            schema:
                example: mydb
                type: string
        end:
            description: Date and time when MongoDB Cloud stops reporting the metrics. This parameter expresses its value in the ISO 8601 timestamp format in UTC. Include this parameter when you do not set **period**.
            in: query
            name: end
            schema:
                format: date-time
                type: string
        envelope:
            description: Flag that indicates whether Application wraps the response in an `envelope` JSON object. Some API clients cannot access the HTTP response headers or status code. To remediate this, set envelope=true in the query. Endpoints that return a list of results use the results object as an envelope. Application adds the status parameter to the response body.
            in: query
            name: envelope
            schema:
                default: false
                type: boolean
        federationSettingsId:
            description: Unique 24-hexadecimal digit string that identifies your federation.
            in: path
            name: federationSettingsId
            required: true
            schema:
                example: 55fa922fb343282757d9554e
                pattern: ^([a-f0-9]{24})$
                type: string
        granularity:
            description: Duration that specifies the interval at which Atlas reports the metrics. This parameter expresses its value in the ISO 8601 duration format in UTC.
            in: query
            name: granularity
            required: true
            schema:
                example: PT1M
                type: string
        groupId:
            description: |-
                Unique 24-hexadecimal digit string that identifies your project. Use the [/groups](#tag/Projects/operation/listProjects) endpoint to retrieve all projects to which the authenticated user has access.

                **NOTE**: Groups and projects are synonymous terms. Your group id is the same as your project id. For existing groups, your group/project id remains the same. The resource and corresponding endpoints use the term groups.
            in: path
            name: groupId
            required: true
            schema:
                example: 32b6e34b3d91647abb20e7b8
                pattern: ^([a-f0-9]{24})$
                type: string
        identityProviderId:
            description: Legacy 20-hexadecimal digit string that identifies the identity provider. This id can be found within the Federation Management Console > Identity Providers tab by clicking the info icon in the IdP ID row of a configured identity provider.
            in: path
            name: identityProviderId
            required: true
            schema:
                example: c2777a9eca931f29fc2f
                pattern: ^([a-f0-9]{20})$
                type: string
        includeCount:
            description: Flag that indicates whether MongoDB Cloud calculates the total number of items for the response. When set to `false`, MongoDB Cloud may skip an additional count operation. The response may still include `totalCount` when the count is available without additional calculation.
            in: query
            name: includeCount
            schema:
                default: true
                type: boolean
        indexName:
            description: Human-readable label that identifies the index.
            in: path
            name: indexName
            required: true
            schema:
                example: myindex
                type: string
        itemsPerPage:
            description: Number of items that the response returns per page.
            in: query
            name: itemsPerPage
            schema:
                default: 100
                maximum: 500
                minimum: 1
                type: integer
        liveMigrationId:
            description: Unique 24-hexadecimal digit string that identifies the migration.
            in: path
            name: liveMigrationId
            required: true
            schema:
                example: 6296fb4c7c7aa997cf94e9a8
                pattern: ^([a-f0-9]{24})$
                type: string
        orgId:
            description: Unique 24-hexadecimal digit string that identifies the organization that contains your projects. Use the [`/orgs`](#tag/Organizations/operation/listOrganizations) endpoint to retrieve all organizations to which the authenticated user has access.
            in: path
            name: orgId
            required: true
            schema:
                example: 4888442a3354817a7320eb61
                pattern: ^([a-f0-9]{24})$
                type: string
        pageNum:
            description: Number of the page that displays the current set of the total objects that the response returns.
            in: query
            name: pageNum
            schema:
                default: 1
                minimum: 1
                type: integer
        period:
            description: Duration over which Atlas reports the metrics. This parameter expresses its value in the ISO 8601 duration format in UTC. Include this parameter when you do not set **start** and **end**.
            in: query
            name: period
            schema:
                example: PT10H
                type: string
        pretty:
            description: Flag that indicates whether the response body should be in the prettyprint format.
            in: query
            name: pretty
            schema:
                default: false
                externalDocs:
                    description: Prettyprint
                    url: https://en.wikipedia.org/wiki/Prettyprint
                type: boolean
        processId:
            description: Combination of hostname and IANA port that serves the MongoDB process. The host must be the hostname, fully qualified domain name (FQDN), or Internet Protocol address (IPv4 or IPv6) of the host that runs the MongoDB process (mongod or mongos). The port must be the IANA port on which the MongoDB process listens for requests.
            in: path
            name: processId
            required: true
            schema:
                example: my.host.name.com:27017
                pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}|([0-9a-f]{1,4}\:){7}([0-9a-f]{1,4})|(([a-z0-9]+\.){1,10}[a-z]+)?(\:[0-9]{4,5})$
                type: string
        sandboxConfigId:
            description: Unique 24-hexadecimal digit string that identifies the sandbox configuration.
            in: path
            name: sandboxConfigId
            required: true
            schema:
                example: 507f1f77bcf86cd799439011
                pattern: ^([a-f0-9]{24})$
                type: string
        start:
            description: Date and time when MongoDB Cloud begins reporting the metrics. This parameter expresses its value in the ISO 8601 timestamp format in UTC. Include this parameter when you do not set **period**.
            in: query
            name: start
            schema:
                format: date-time
                type: string
    responses:
        accepted:
            description: Accepted.
        badRequest:
            content:
                application/json:
                    example:
                        detail: (This is just an example, the exception may not be related to this endpoint) No provider AWS exists.
                        error: 400
                        errorCode: VALIDATION_ERROR
                        reason: Bad Request
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Bad Request.
        conflict:
            content:
                application/json:
                    example:
                        detail: '(This is just an example, the exception may not be related to this endpoint) Cannot delete organization link while there is active migration in following project ids: 60c4fd418ebe251047c50554'
                        error: 409
                        errorCode: CANNOT_DELETE_ORG_ACTIVE_LIVE_MIGRATION_ATLAS_ORG_LINK
                        reason: Conflict
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Conflict.
        forbidden:
            content:
                application/json:
                    example:
                        detail: (This is just an example, the exception may not be related to this endpoint)
                        error: 403
                        errorCode: CANNOT_CHANGE_GROUP_NAME
                        reason: Forbidden
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Forbidden.
        forbiddenOrResourcePolicyViolation:
            content:
                application/json:
                    examples:
                        forbidden:
                            summary: Forbidden
                            value:
                                detail: (This is just an example, the exception may not be related to this endpoint)
                                error: 403
                                errorCode: CANNOT_CHANGE_GROUP_NAME
                                reason: Forbidden
                        resourcePolicyViolation:
                            summary: Atlas Resource Policy violation
                            value:
                                detail: Invalid Configuration. Contains selections that are unavailable due to your organization's resource policies.
                                error: 403
                                errorCode: ATLAS_RESOURCE_POLICIES_VIOLATION_NOT_AUTHORIZED
                                parameters: []
                                policiesCausingDecision:
                                    - id: 32b6e34b3d91647abb20e7b8
                                      name: forbid-aws-clusters
                                reason: Forbidden
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Forbidden. Atlas Resource Policy details are returned only when an Atlas Resource Policy denies the request.
        gone:
            content:
                application/json:
                    example:
                        detail: This happens when a resource is marked for sunset and the sunset date is in the past.
                        error: 410
                        errorCode: VERSION_GONE
                        reason: Gone
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Gone.
        internalServerError:
            content:
                application/json:
                    example:
                        detail: (This is just an example, the exception may not be related to this endpoint)
                        error: 500
                        errorCode: UNEXPECTED_ERROR
                        reason: Internal Server Error
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Internal Server Error.
        methodNotAllowed:
            content:
                application/json:
                    example:
                        detail: (This is just an example, the exception may not be related to this endpoint)
                        error: 405
                        errorCode: ATLAS_BACKUP_CANCEL_SHARD_RESTORE_JOB_NOT_ALLOWED
                        reason: Method Not Allowed
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Method Not Allowed.
        notFound:
            content:
                application/json:
                    example:
                        detail: (This is just an example, the exception may not be related to this endpoint) Cannot find resource AWS
                        error: 404
                        errorCode: RESOURCE_NOT_FOUND
                        reason: Not Found
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Not Found.
        paymentRequired:
            content:
                application/json:
                    example:
                        detail: (This is just an example, the exception may not be related to this endpoint)
                        error: 402
                        errorCode: NO_PAYMENT_INFORMATION_FOUND
                        reason: Payment Required
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Payment Required.
        serviceUnavailable:
            content:
                application/json:
                    example:
                        detail: (This is just an example, the exception may not be related to this endpoint)
                        error: 503
                        errorCode: SERVICE_UNAVAILABLE
                        reason: Service Unavailable
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Service Unavailable.
        tooManyRequests:
            content:
                application/json:
                    example:
                        detail: (This is just an example, the exception may not be related to this endpoint)
                        error: 429
                        errorCode: RATE_LIMITED
                        reason: Too Many Requests
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Too Many Requests.
            headers:
                RateLimit-Limit:
                    $ref: '#/components/headers/HeaderRateLimitLimit'
                RateLimit-Remaining:
                    $ref: '#/components/headers/HeaderRateLimitRemaining'
                Retry-After:
                    $ref: '#/components/headers/HeaderRetryAfter'
        unauthorized:
            content:
                application/json:
                    example:
                        detail: (This is just an example, the exception may not be related to this endpoint)
                        error: 401
                        errorCode: NOT_ORG_GROUP_CREATOR
                        reason: Unauthorized
                    schema:
                        $ref: '#/components/schemas/ApiError'
            description: Unauthorized.
    schemas:
        ApiError:
            properties:
                badRequestDetail:
                    $ref: '#/components/schemas/BadRequestDetail'
                detail:
                    description: Describes the specific conditions or reasons that cause each type of error.
                    nullable: true
                    type: string
                error:
                    description: HTTP status code returned with this error.
                    externalDocs:
                        url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status
                    format: int32
                    readOnly: true
                    type: integer
                errorCode:
                    description: Application error code returned with this error.
                    readOnly: true
                    type: string
                parameters:
                    description: Parameters used to give more information about the error.
                    items:
                        type: object
                    readOnly: true
                    type: array
                policiesCausingDecision:
                    description: Atlas Resource Policies that caused the request to be denied. Returned only when `errorCode` is `ATLAS_RESOURCE_POLICIES_VIOLATION_NOT_AUTHORIZED`.
                    items:
                        $ref: '#/components/schemas/ResourcePolicyReference'
                    maxItems: 100
                    readOnly: true
                    type: array
                    x-xgen-array-semantic: set
                reason:
                    description: Application error message returned with this error.
                    nullable: true
                    readOnly: true
                    type: string
            required:
                - error
                - errorCode
            type: object
        ApiSearchAutoScalingView:
            description: Settings that let Atlas change the Search Node tier on its own. Bounds apply to the whole deployment, and Atlas scales each region and shard independently within them. Omit to keep autoscaling off.
            properties:
                compute:
                    $ref: '#/components/schemas/ApiSearchComputeAutoScalingView'
            type: object
        ApiSearchComputeAutoScalingView:
            description: Settings that control Search Node tier scaling based on load.
            properties:
                enabled:
                    default: false
                    description: Flag that indicates whether Atlas raises the Search Node tier when the nodes are under sustained load. If set to `true`, you must also set `maxInstanceTier`.
                    type: boolean
                maxInstanceTier:
                    description: Highest Search Node tier that Atlas can scale up to. Required when `enabled` is `true`.
                    enum:
                        - S10
                        - S20
                        - S30
                        - S40
                        - S50
                        - S60
                        - S70
                        - S80
                        - S90
                        - S100
                        - S110
                        - S120
                        - S130
                        - S135
                        - S140
                    type: string
                minInstanceTier:
                    description: Lowest Search Node tier that Atlas can scale down to. Required when `scaleDownEnabled` is `true`. Scaling down is not supported yet, so setting this returns an error.
                    enum:
                        - S10
                        - S20
                        - S30
                        - S40
                        - S50
                        - S60
                        - S70
                        - S80
                        - S90
                        - S100
                        - S110
                        - S120
                        - S130
                        - S135
                        - S140
                    type: string
                scaleDownEnabled:
                    default: false
                    description: Flag that indicates whether Atlas lowers the Search Node tier when load drops. Takes effect only when `enabled` is `true`. If set to `true`, you must also set `minInstanceTier`. Scaling down is not supported yet, so setting this to `true` returns an error.
                    type: boolean
            type: object
        ApiSearchDeploymentEffectiveSpecView:
            properties:
                cloudProvider:
                    description: Cloud service provider on which Search Nodes are provisioned.
                    enum:
                        - AWS
                        - AZURE
                        - GCP
                    readOnly: true
                    type: string
                instanceSize:
                    description: Hardware specification for the Search Node instance sizes.
                    enum:
                        - S10_HIGHCPU
                        - S20_HIGHCPU_NVME
                        - S30_HIGHCPU_NVME
                        - S40_HIGHCPU_NVME
                        - S50_HIGHCPU_NVME
                        - S60_HIGHCPU_NVME
                        - S70_HIGHCPU_NVME
                        - S80_HIGHCPU_NVME
                        - S30_LOWCPU_NVME
                        - S40_LOWCPU_NVME
                        - S50_LOWCPU_NVME
                        - S60_LOWCPU_NVME
                        - S70_LOWCPU_NVME
                        - S80_LOWCPU_NVME
                        - S90_LOWCPU_NVME
                        - S100_LOWCPU_NVME
                        - S110_LOWCPU_NVME
                        - S120_LOWCPU_NVME
                        - S130_LOWCPU_NVME
                        - S135_LOWCPU_NVME
                        - S140_LOWCPU_NVME
                        - S40_STORAGE_NVME
                        - S50_STORAGE_NVME
                        - S60_STORAGE_NVME
                        - S80_STORAGE_NVME
                        - S90_STORAGE_NVME
                    readOnly: true
                    type: string
                nodeCount:
                    description: Number of Search Nodes for this configuration.
                    example: 2
                    format: int32
                    maximum: 32
                    minimum: 2
                    readOnly: true
                    type: integer
                regionName:
                    description: Cloud provider region where Search Nodes are provisioned.
                    example: US_EAST_1
                    readOnly: true
                    type: string
                shardId:
                    description: Shard that owns this Search Node configuration.
                    readOnly: true
                    type: string
            type: object
        ApiSearchDeploymentPreviewResponseView:
            properties:
                autoScaling:
                    allOf:
                        - $ref: '#/components/schemas/ApiSearchAutoScalingView'
                    description: Autoscaling settings configured for this Search deployment.
                    readOnly: true
                baselineSpecs:
                    description: List of starting settings for the Search Nodes in each cluster region.
                    items:
                        $ref: '#/components/schemas/ApiSearchDeploymentEffectiveSpecView'
                    readOnly: true
                    type: array
                effectiveSpecs:
                    description: List of settings that configure the Search Nodes for your cluster. Each entry describes one region or, when `shardId` is present, one shard in one region.
                    items:
                        $ref: '#/components/schemas/ApiSearchDeploymentEffectiveSpecView'
                    readOnly: true
                    type: array
                encryptionAtRestProvider:
                    description: Cloud service provider that manages your customer keys to provide an additional layer of Encryption At Rest for the cluster.
                    enum:
                        - NONE
                        - AWS
                        - AZURE
                        - GCP
                    externalDocs:
                        description: Encryption at Rest using Customer Key Management
                        url: https://www.mongodb.com/docs/atlas/security-kms-encryption/
                    nullable: true
                    readOnly: true
                    type: string
                groupId:
                    description: Unique 24-hexadecimal character string that identifies the project.
                    example: 32b6e34b3d91647abb20e7b8
                    pattern: ^([a-f0-9]{24})$
                    readOnly: true
                    type: string
                id:
                    description: Unique 24-hexadecimal digit string that identifies the search deployment.
                    example: 32b6e34b3d91647abb20e7b8
                    pattern: ^([a-f0-9]{24})$
                    readOnly: true
                    type: string
                specs:
                    deprecated: true
                    description: Deprecated. `specs` will be removed in a future release. We strongly recommend that you use `effectiveSpecs` instead.
                    items:
                        $ref: '#/components/schemas/ApiSearchDeploymentSpecView'
                    readOnly: true
