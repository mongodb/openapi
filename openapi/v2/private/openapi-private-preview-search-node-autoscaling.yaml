        ApiSearchDeploymentSpecView:
            description: Hardware specification for the Search Nodes that back a search deployment.
            properties:
                instanceSize:
                    description: Hardware specification for the Search Node instance sizes.
                    enum:
                        - S10_HIGHCPU
                        - S20_HIGHCPU_NVME
                        - S30_HIGHCPU_NVME
