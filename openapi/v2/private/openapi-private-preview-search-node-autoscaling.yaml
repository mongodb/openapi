                        - S130_LOWCPU_NVME
                        - S135_LOWCPU_NVME
                        - S140_LOWCPU_NVME
                        - S40_STORAGE_NVME
                        - S50_STORAGE_NVME
                        - S60_STORAGE_NVME
                        - S80_STORAGE_NVME
                        - S90_STORAGE_NVME
                    type: string
                nodeCount:
                    description: Number of Search Nodes in this region. Optional; falls back to the request-level default when omitted.
                    example: 2
                    format: int32
                    maximum: 32
                    minimum: 2
                    nullable: true
                    type: integer
                regionName:
                    description: Cloud provider region where Search Nodes are provisioned. Required when the request configures more than one region; optional for single-region requests.
                    example: US_EAST_1
                    nullable: true
                    type: string
            required:
                - instanceSize
            type: object
        ApiSearchDeploymentRequestView:
            properties:
                autoScaling:
                    allOf:
                        - $ref: '#/components/schemas/ApiSearchAutoScalingView'
                    description: Settings that let Atlas change the Search Node tier on its own. Bounds apply to the whole deployment, and Atlas scales each region and shard independently within them. Omit to keep autoscaling off.
                defaultNodeCount:
                    description: Default number of Search Nodes per region. Applied to a region without an explicit override.
                    example: 2
                    format: int32
                    maximum: 32
